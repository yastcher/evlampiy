[project]
name = "evlampiy"
version = "0.9.4"
description = "Bot (Evlampiy) for managing voice notes"
readme = "README.md"
authors = [{ name = "Yast", email = "yastcher@gmail.com" }]
requires-python = "~=3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
    "python-dotenv~=1.2.2",
    "pydantic-settings>=2.7,<3",
    "wit~=6.0.1",
    "pydub~=0.25.1",
    "audioop-lts>=0.2; python_version>='3.13'",
    "beanie~=2.0.1",
    "motor==3.7.1",
    "pywa~=3.8",
    "fastapi~=0.115",
    "uvicorn~=0.34",
    "aiogram~=3.27",
    "aiohttp>=3.13.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "ty>=0.0.32",
    "pytest>=9.0.2",
    "pytest-asyncio~=1.3",
    "pytest-mock==3.15.1",
    "pytest-cov~=7.0.0",
    "pytestarch>=2.0",
    "cosmic-ray>=8.3",
    "mongomock-motor~=0.0.34",
    "responses~=0.26.0",
]

[tool.ruff]
line-length = 120
exclude = [
    ".claude",
    ".github",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "I", # isort
    "G", # flake8-logging-format (logger %s not f-string)
    "PLC", # pylint convention (PLC0415 — no local imports)
    "PLR", # pylint refactor (PLR2004 — magic numbers)
    "SIM", # flake8-simplify
    "S", # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "S105", "S106"]
"src/localization.py" = ["RUF001"]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.isort]
known-third-party = ["telegram"]
known-local-folder = [
    "src",
    "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# skip-magic-trailing-comma = true

[tool.ty.environment]
python-version = "3.14"
root = ["."]

[tool.ty.rules]
unresolved-import = "warn"

[[tool.ty.overrides]]
include = ["tests/"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
addopts = [
    "-p", "pytest_cov",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
    "--cov-branch",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
exclude_also = [
    # PTB handler guards - framework guarantees effective_user/message/etc. non-None in handler context
    "if update\\.message is None",
    "if update\\.effective_user is None",
    "if update\\.effective_chat is None",
    "if update\\.pre_checkout_query is None",
    "if update\\.message\\.successful_payment is None",
    "if query is None",
]
