[project]
name = "evlampiy"
version = "0.9.7"
description = "Bot (Evlampiy) for managing voice notes"
readme = "README.md"
authors = [{ name = "Yast", email = "yastcher@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
    "python-dotenv~=1.2.4",
    "pydantic-settings>=2.16,<3",
    "wit~=6.0.1",
    "pydub~=0.25.1",
    "audioop-lts>=0.2; python_version>='3.13'",
    "beanie~=2.2.0",
    "pymongo~=4.19",
    "pywa~=4.5",
    "fastapi~=0.162",
    "uvicorn~=0.54",
    "aiogram~=3.31",
    "aiohttp>=3.14.5",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.101",
    "pytest>=9.2.0",
    "pytest-asyncio~=1.4",
    "pytest-mock==3.17.0",
    "pytest-cov~=7.1.0",
    "pytest-timeout>=2.4",
    "hypothesis>=6.170",
    "pytestarch>=5.1",
    "cosmic-ray>=8.9",
    "testcontainers[mongodb]>=4.15",
    "responses~=0.26.3",
    # Starlette's TestClient runs on httpx2 and deprecates httpx.
    "httpx2>=2.16",
]

[tool.ruff]
line-length = 120
exclude = [
    ".claude",
    ".github",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "I", # isort
    "G", # flake8-logging-format (logger %s not f-string)
    "PLC", # pylint convention (PLC0415 — no local imports)
    "PLR", # pylint refactor (PLR2004 — magic numbers)
    "SIM", # flake8-simplify
    "S", # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# S603/S607: tests run git and the repository's own scripts with fixed arguments.
"tests/*" = ["S101", "PLR2004", "S105", "S106", "S603", "S607"]
"evlampiy/localization.py" = ["RUF001"]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.isort]
known-third-party = ["telegram"]
known-local-folder = [
    "evlampiy",
    "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# skip-magic-trailing-comma = true

[tool.ty.environment]
python-version = "3.14"
root = ["."]

[tool.ty.rules]
import-not-found = "warn"

[[tool.ty.overrides]]
include = ["tests/"]

[tool.ty.overrides.rules]
import-not-found = "ignore"

[tool.pytest.ini_options]
addopts = [
    "-p", "pytest_cov",
    "--cov=evlampiy",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
    "--cov-branch",
]
testpaths = ["tests"]
asyncio_mode = "auto"
# Every async fixture is per test, the database client included.
asyncio_default_fixture_loop_scope = "function"
# A test that hangs fails after this many seconds, with the stack where it hung, instead of
# holding the run and its memory until something kills it. Generous on purpose: the first
# test's setup starts the MongoDB container, an image pull included.
timeout = 120

[tool.coverage.report]
# A ratchet: raise it as coverage grows, never lower it. The README badges show this number.
fail_under = 91.4
precision = 2
exclude_also = [
    # PTB handler guards - framework guarantees effective_user/message/etc. non-None in handler context
    "if update\\.message is None",
    "if update\\.effective_user is None",
    "if update\\.effective_chat is None",
    "if update\\.pre_checkout_query is None",
    "if update\\.message\\.successful_payment is None",
    "if query is None",
]
