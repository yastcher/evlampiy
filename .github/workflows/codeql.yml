name: CodeQL

# Taint analysis across functions — injections, SSRF, secrets reaching a log — which pattern
# rules (ruff's Bandit set, Semgrep in ci.yml) cannot follow. Findings go to the Security tab.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # New queries find old code: once a week on the default branch.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The application, and the workflows themselves (script injection, untrusted checkouts).
        language: [python, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:${{ matrix.language }}
