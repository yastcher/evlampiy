name: Deploy to Server

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main
      - release

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --group dev

      - name: Run linter
        run: uv run ruff check

      - name: Run type checker
        run: uv run ty check src

      - name: Run tests with coverage
        env:
          MONGO_URI: mongodb://localhost:27017/
        run: uv run pytest --cov=src --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  build-and-deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs package write to push the image to GHCR. No extra secret
    # to manage — the token is minted per run.
    permissions:
      contents: read
      packages: write
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || 'evlampiy' }}
      # IMAGE_TAG is the release commit SHA — an immutable handle the server pins
      # in its .env, so a rollback is `IMAGE_TAG=<old-sha> docker compose up -d`.
      EVLAMPIY_IMAGE: ghcr.io/yastcher/evlampiy_notes
      IMAGE_TAG: ${{ github.sha }}
      # Logs the server into GHCR for the pull (ephemeral, per-run token).
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # `--pull` forces a fresh pull of the python base image instead of reusing a
        # cached layer, so its security patches actually reach production. Tag both
        # the immutable :<sha> (rollback handle) and the moving :latest.
        run: |
          docker build --pull \
            -t "$EVLAMPIY_IMAGE:$IMAGE_TAG" \
            -t "$EVLAMPIY_IMAGE:latest" \
            .
          docker push "$EVLAMPIY_IMAGE:$IMAGE_TAG"
          docker push "$EVLAMPIY_IMAGE:latest"

      - name: Deploy on server
        run: |
          set -euo pipefail
          echo "$SSH_PRIVATE_KEY" | base64 --decode > private_key
          chmod 600 private_key

          # ServerAlive* keepalives: `docker compose up -d` blocks with no stdout while
          # it waits for the mongodb healthcheck, and that idle window let a firewall
          # between the runner and the server reap the TCP connection (Broken pipe,
          # exit 255). Probing every 30s keeps the session alive.
          SSH_OPTS="-i private_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          REMOTE="$SERVER_USER@$SERVER_IP"

          ssh $SSH_OPTS $REMOTE "mkdir -p ~/$DEPLOY_DIR"
          scp $SSH_OPTS docker-compose.yml $REMOTE:~/$DEPLOY_DIR/docker-compose.yml

          # Log the server into GHCR with the same ephemeral GITHUB_TOKEN, piped over
          # stdin (never on the command line / process list). Valid only for this run —
          # enough to pull the image just pushed; we log out after.
          echo "$GHCR_TOKEN" | ssh $SSH_OPTS $REMOTE \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          # DEPLOY_DIR + image coordinates are passed into the remote shell so the
          # heredoc can stay quoted (verbatim) — that keeps `$(seq ...)` and friends
          # from being expanded on the runner.
          ssh $SSH_OPTS $REMOTE \
            "DEPLOY_DIR='$DEPLOY_DIR' EVLAMPIY_IMAGE='$EVLAMPIY_IMAGE' IMAGE_TAG='$IMAGE_TAG' bash -lse" <<'REMOTE_SCRIPT'
            set -euo pipefail
            cd ~/$DEPLOY_DIR

            # Pin this release in .env so Compose resolves the exact :<sha> image.
            set_env() {
              local key="$1" val="$2"
              if grep -q "^$key=" .env 2>/dev/null; then
                sed -i "s|^$key=.*|$key=$val|" .env
              else
                echo "$key=$val" >> .env
              fi
            }
            set_env EVLAMPIY_IMAGE "$EVLAMPIY_IMAGE"
            set_env IMAGE_TAG "$IMAGE_TAG"

            # Hard prerequisite: set -e aborts the deploy if the pull fails, leaving the
            # running bot untouched.
            docker compose pull

            # No `docker compose down` — only the bot's image changed, so Compose
            # recreates just that container and MongoDB keeps running.
            docker compose up -d --remove-orphans

            # Drop the now-expired GHCR credential from the server's docker config.
            docker logout ghcr.io || true

            # Dangling images only. NEVER `docker volume prune` here, and never touch
            # ./mongo_data — that bind mount IS the database.
            docker image prune -f

            # Smoke check — fail loudly if /health doesn't answer within 30s, so a
            # broken release surfaces in CI instead of leaving the bot silently down.
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:8000/health >/dev/null; then
                echo "OK: /health is up"
                exit 0
              fi
              sleep 2
            done
            echo "FAIL: /health did not respond in 30s — last 60 log lines:"
            docker compose logs --tail=60
            exit 1
          REMOTE_SCRIPT

          shred -u private_key || rm -f private_key
