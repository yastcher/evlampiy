name: Gemini Code Review

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY not configured, skipping review"
            exit 0
          fi
          echo "has_key=true" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.has_key == 'true'
        with:
          fetch-depth: 0

      - name: Get PR diff
        if: env.has_key == 'true'
        # Through the environment, never spliced into the script: an expression in `run:` is shell code.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > /tmp/diff.txt

      - name: Review with Gemini
        if: env.has_key == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.log('GEMINI_API_KEY not configured, skipping review');
              return;
            }

            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/diff.txt', 'utf8').slice(0, 30000);

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    parts: [{
                      text: `Review this PR diff. Focus on:
            - Security vulnerabilities
            - Performance issues
            - Code duplication
            - Magic strings/numbers (should use constants)
            - Code style issues

            Be concise. Only mention real problems.

            Diff:
            ${diff}`
                    }]
                  }]
                })
              }
            );

            const data = await response.json();
            console.log('Gemini response:', JSON.stringify(data, null, 2));

            if (data.error) {
              console.log(`Gemini API error: ${data.error.message}`);
              return;
            }

            const review = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!review) {
              console.log('No review generated');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Gemini Code Review\n\n${review}`
            });
