services:

  mongodb:
    # Pinned to prevent regression: mongo 8.0.5..8.0.20 and 8.2.x crash with
    # SIGSEGV ~30s after startup on hosts with kernel 6.x + glibc 2.39+.
    # Verified working: 8.0.3, 8.0.4. Re-test before bumping past 8.0.4.
    image: mongo:8.0.3
    container_name: mongodb
    volumes:
      - ./mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5

  evlampiy_notes:
    image: evlampiy_notes:latest
    restart: always
    env_file:
      - .env
    environment:
      FASTAPI_HOST: "0.0.0.0"
    ports:
      - "8000:8000"  # HTTP server: /health + WhatsApp webhook
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
