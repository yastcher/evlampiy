# Cap every container's json log so it can't fill the host disk — docker's default
# json-file driver keeps logs unbounded. 10MB × 3 files per service is plenty to debug.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  mongodb:
    # Pinned to prevent regression: mongo 8.0.5..8.0.20 and 8.2.x crash with
    # SIGSEGV ~30s after startup on hosts with kernel 6.x + glibc 2.39+.
    # Verified working: 8.0.3, 8.0.4. Re-test before bumping past 8.0.4.
    image: mongo:8.0.3
    container_name: mongodb
    # --quiet drops the per-connection "accepted/closed" INFO lines that the
    # healthcheck (mongosh opens a small connection pool every probe) writes on loop.
    command: ["mongod", "--quiet"]
    logging: *default-logging
    volumes:
      - ./mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 30s
      timeout: 5s
      retries: 5

  evlampiy_notes:
    # Prod pulls the image from GHCR: the deploy writes EVLAMPIY_IMAGE and IMAGE_TAG
    # (the release commit SHA) into the server's .env, so Compose resolves the exact
    # release and a later manual `docker compose up` reproduces it instead of drifting.
    # The defaults keep local dev registry-free — `docker build -t evlampiy_notes:latest .`
    # then `docker compose up -d`.
    image: ${EVLAMPIY_IMAGE:-evlampiy_notes}:${IMAGE_TAG:-latest}
    restart: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      FASTAPI_HOST: "0.0.0.0"
    ports:
      - "8000:8000"  # HTTP server: /health + WhatsApp webhook
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
